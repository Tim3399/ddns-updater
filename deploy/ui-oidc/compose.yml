name: ddns-updater-oidc

services:
  ddns-updater:
    image: ${DDNS_IMAGE:?Set DDNS_IMAGE to an immutable image reference}
    container_name: ddns-updater
    restart: unless-stopped
    init: true
    user: "1000:1000"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    expose:
      - "8000"
    volumes:
      - ./data:/updater/data
      - ./secrets/config.json:/run/secrets/ddns-config.json:ro
    environment:
      CONFIG: ""
      CONFIG_FILEPATH: /run/secrets/ddns-config.json
      DATADIR: /updater/data
      UMASK: "0077"

      SERVER_ENABLED: "yes"
      LISTENING_ADDRESS: ":8000"
      PERIOD: ${PERIOD:-5m}
      UPDATE_COOLDOWN_PERIOD: ${UPDATE_COOLDOWN_PERIOD:-5m}

      PUBLICIP_FETCHERS: http
      PUBLICIP_HTTP_PROVIDERS: ${PUBLICIP_HTTP_PROVIDERS:-ipify,icanhazip,nnev}
      PUBLICIPV4_HTTP_PROVIDERS: ${PUBLICIPV4_HTTP_PROVIDERS:-ipify,icanhazip,nnev}
      PUBLICIPV6_HTTP_PROVIDERS: ${PUBLICIPV6_HTTP_PROVIDERS:-ipify,icanhazip,nnev}
      HTTP_TIMEOUT: ${HTTP_TIMEOUT:-10s}

      BACKUP_PERIOD: "0"
      LOG_LEVEL: info
      LOG_CALLER: hidden
    networks:
      edge-auth:
    stop_grace_period: 10s

  oauth2-proxy:
    image: ${OAUTH2_PROXY_IMAGE:-quay.io/oauth2-proxy/oauth2-proxy:v7.15.4}
    container_name: ddns-updater-auth
    restart: unless-stopped
    depends_on:
      - ddns-updater
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:4180:4180"
    volumes:
      - ./secrets/oidc-client-secret:/run/secrets/oidc-client-secret:ro
      - ./secrets/cookie-secret:/run/secrets/cookie-secret:ro
    command:
      - --provider=oidc
      - --oidc-issuer-url=${OIDC_ISSUER_URL:?Set OIDC_ISSUER_URL}
      - --client-id=${OIDC_CLIENT_ID:-ddns-updater}
      - --client-secret-file=/run/secrets/oidc-client-secret
      - --cookie-secret-file=/run/secrets/cookie-secret
      - --email-domain=*
      - --scope=openid profile email
      - --upstream=http://ddns-updater:8000/
      - --http-address=0.0.0.0:4180
      - --redirect-url=${DDNS_EXTERNAL_URL:?Set DDNS_EXTERNAL_URL}/oauth2/callback
      - --reverse-proxy=true
      - --trusted-proxy-ip=172.31.250.1/32
      - --code-challenge-method=S256
      - --cookie-secure=true
      - --cookie-samesite=lax
      - --cookie-name=__Host-ddns_updater
      - --skip-provider-button=true
    networks:
      edge-auth:

networks:
  edge-auth:
    driver: bridge
    ipam:
      config:
        - subnet: 172.31.250.0/24
